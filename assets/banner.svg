<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Mohammed Mafhoum — Software Engineering Co-op at uOttawa">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03070f"/>
      <stop offset="0.55" stop-color="#071a2c"/>
      <stop offset="1" stop-color="#0a2e1c"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f5a2e"/>
      <stop offset="1" stop-color="#0a3d20"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#e8fff1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8fff1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="tickerClip"><rect x="0" y="322" width="1200" height="38"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .flood { animation: flicker 4s ease-in-out infinite; }
      .flood.r { animation-delay: 1.3s; }
      @keyframes flicker { 0%,100% { opacity: .9 } 45% { opacity: .65 } 50% { opacity: 1 } 55% { opacity: .75 } }
      .live { animation: blink 1.2s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      .ball { animation: roll 7s cubic-bezier(.45,.05,.55,.95) infinite; }
      @keyframes roll {
        0%   { transform: translate(-60px, 0) }
        85%  { transform: translate(1260px, 0) }
        100% { transform: translate(1260px, 0) }
      }
      .spin { animation: spin 0.9s linear infinite; transform-origin: 0 0; transform-box: view-box; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .ticker { animation: scroll 28s linear infinite; }
      @keyframes scroll { from { transform: translateX(0) } to { transform: translateX(-1400px) } }
      .fadeUp { animation: up .9s ease-out both; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .6s } .d3 { animation-delay: 1s }
      @keyframes up { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
      .star { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 50% { opacity: .2 } }
    </style>
  </defs>

  <!-- night sky -->
  <rect width="1200" height="360" fill="url(#sky)"/>
  <g fill="#cfe9ff">
    <circle class="star" cx="140" cy="40" r="1.2"/>
    <circle class="star" cx="310" cy="22" r="1" style="animation-delay:.8s"/>
    <circle class="star" cx="520" cy="55" r="1.1" style="animation-delay:1.6s"/>
    <circle class="star" cx="700" cy="18" r="1" style="animation-delay:.4s"/>
    <circle class="star" cx="880" cy="48" r="1.3" style="animation-delay:2.1s"/>
    <circle class="star" cx="1040" cy="30" r="1" style="animation-delay:1.1s"/>
  </g>

  <!-- floodlights -->
  <g class="flood">
    <polygon points="70,30 -160,330 420,330" fill="url(#flood)"/>
    <rect x="60" y="22" width="22" height="12" rx="2" fill="#f5fff8"/>
    <rect x="69" y="34" width="4" height="120" fill="#2b3b4d"/>
  </g>
  <g class="flood r">
    <polygon points="1130,30 780,330 1360,330" fill="url(#flood)"/>
    <rect x="1118" y="22" width="22" height="12" rx="2" fill="#f5fff8"/>
    <rect x="1127" y="34" width="4" height="120" fill="#2b3b4d"/>
  </g>

  <!-- pitch in perspective -->
  <polygon points="180,232 1020,232 1200,322 0,322" fill="url(#pitch)"/>
  <g opacity="0.18" fill="#ffffff">
    <polygon points="285,232 390,232 330,322 150,322"/>
    <polygon points="495,232 600,232 600,322 450,322"/>
    <polygon points="705,232 810,232 870,322 750,322"/>
    <polygon points="915,232 1020,232 1200,322 1050,322"/>
  </g>
  <g fill="none" stroke="#e9fbe9" stroke-opacity="0.55" stroke-width="2">
    <polygon points="180,232 1020,232 1200,322 0,322"/>
    <line x1="600" y1="232" x2="600" y2="322"/>
    <ellipse cx="600" cy="275" rx="95" ry="22"/>
  </g>

  <!-- rolling ball -->
  <g class="ball">
    <g transform="translate(0,300)">
      <ellipse cx="0" cy="14" rx="14" ry="3.5" fill="#000" opacity=".35"/>
      <g class="spin">
        <circle r="13" fill="#ffffff" stroke="#111" stroke-width="1"/>
        <polygon points="0,-5 4.8,-1.5 3,4 -3,4 -4.8,-1.5" fill="#111"/>
        <path d="M0,-5 L0,-13 M4.8,-1.5 L12,-4 M3,4 L7.5,10.5 M-3,4 L-7.5,10.5 M-4.8,-1.5 L-12,-4" stroke="#111" stroke-width="1.2"/>
      </g>
    </g>
  </g>

  <!-- scoreboard -->
  <g transform="translate(445,26)">
    <rect width="310" height="62" rx="10" fill="#0b1220" stroke="#30363d"/>
    <rect x="10" y="10" width="118" height="42" rx="6" fill="#0f2a1a"/>
    <rect x="182" y="10" width="118" height="42" rx="6" fill="#2a0f12"/>
    <text x="69" y="37" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#7ee787">MAFHOUM FC</text>
    <text x="241" y="37" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#ff7b72">BUGS</text>
    <text x="155" y="40" text-anchor="middle" class="mono" font-size="22" font-weight="800" fill="#ffd33d">1–0</text>
    <circle class="live" cx="14" cy="-8" r="4" fill="#ff4d4f"/>
    <text x="24" y="-4" class="mono" font-size="11" fill="#ff9b9b" letter-spacing="1">LIVE</text>
    <text x="296" y="-4" text-anchor="end" class="mono" font-size="11" fill="#8b949e">90+2'</text>
  </g>

  <!-- name + title -->
  <g text-anchor="middle">
    <text x="600" y="150" class="sans fadeUp d1" font-size="54" font-weight="800" letter-spacing="3" fill="url(#nameGrad)">MOHAMMED MAFHOUM</text>
    <text x="600" y="186" class="sans fadeUp d2" font-size="19" font-weight="600" fill="#c9d1d9">Software Engineering Co-op · University of Ottawa</text>
    <text x="600" y="214" class="mono fadeUp d3" font-size="15" fill="#7ee787">IT Support  ▸  Networks  ▸  Linux  ▸  Cloud  ▸  Python</text>
  </g>

  <!-- ticker -->
  <rect x="0" y="322" width="1200" height="38" fill="#0d1117"/>
  <rect x="0" y="322" width="1200" height="2" fill="#2ea043"/>
  <g clip-path="url(#tickerClip)">
    <g class="ticker">
      <text x="20" y="347" class="mono" font-size="15" fill="#c9d1d9" xml:space="preserve">⚽ DIPLOMA WITH DISTINCTION — COLLÈGE LA CITÉ 2026   •   5+ YEARS FRONT-LINE SUPPORT (BELL · CRA)   •   BILINGUAL FR / EN   •   OPEN TO CO-OP &amp; INTERNSHIPS   •   </text>
      <text x="1420" y="347" class="mono" font-size="15" fill="#c9d1d9" xml:space="preserve">⚽ DIPLOMA WITH DISTINCTION — COLLÈGE LA CITÉ 2026   •   5+ YEARS FRONT-LINE SUPPORT (BELL · CRA)   •   BILINGUAL FR / EN   •   OPEN TO CO-OP &amp; INTERNSHIPS   •   </text>
    </g>
  </g>
</svg>
